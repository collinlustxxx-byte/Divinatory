<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divinatory 🔮</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root">
        <header>
            <h1>🔮 Divinatory</h1>
            <p>L'Art du Tirage de Cartes Divinatoires</p>
        </header>

        <main>
            <section class="tirage-container">
                <h2>Tirage des Cartes</h2>
                <button class="draw-button" id="start-btn">Commencer le Tirage</button>
                
                <div id="cards-grid" class="cards-grid" style="display:none;">
                    <!-- Les cartes s'afficheront ici -->
                </div>

                <div id="revealed-card" class="revealed-card" style="display:none;">
                    <!-- La carte révélée s'affichera ici -->
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Divinatory</p>
        </footer>
    </div>

    <!-- Musique d'ambiance -->
    <audio id="ambient-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script src="app.js"></script>
</body>
</html>
